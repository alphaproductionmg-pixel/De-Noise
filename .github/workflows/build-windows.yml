name: Build Windows (VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/DeNoise_artefacts/Release/VST3/De-Noise.vst3" "dist/De-Noise.vst3"
          Copy-Item "build/DeNoise_artefacts/Release/Standalone/De-Noise.exe" "dist/De-Noise.exe"
          Compress-Archive -Path dist/* -DestinationPath De-Noise-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: De-Noise-Windows
          path: De-Noise-Windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: De-Noise-Windows.zip
